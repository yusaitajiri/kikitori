name: nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GGML_NATIVE: "OFF"
      KIKITORI_TEST_CPU: "1"
      KIKITORI_REQUIRE_FIXTURES: "1"
      # base-q5 loses more accuracy than turbo-q5 when cut into utterances (about 4 points
      # here). The section 18 three-point rule is checked with turbo-q5 on the reference GPU
      # machine; this run guards against regressions.
      KIKITORI_CER_MARGIN: "0.06"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: nightly
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      # LibriVox MP3s (checked against pinned SHA-256s) and the base-q5 model.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            tests/fixtures/cache
            ${{ runner.temp }}/models
          key: fixtures-and-models-v1
      - name: Build fixtures
        run: python tests/fixtures/build_fixtures.py
      - name: Download base-q5
        working-directory: src-tauri
        run: cargo run --release --example download_model -- base-q5 "${{ runner.temp }}/models"
      - name: Integration tests (CPU)
        working-directory: src-tauri
        env:
          KIKITORI_TEST_MODEL: ${{ runner.temp }}/models/ggml-base-q5_1.bin
        run: cargo test --release --test pipeline -- --ignored --nocapture --test-threads 1
