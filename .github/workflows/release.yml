name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Portable CPU code (AVX2), never the runner's own instruction set.
      GGML_NATIVE: "OFF"
      # Signs the update bundle (section 17). The build fails without them once the updater
      # is enabled, rather than shipping a release that installed copies can't update to.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
      # whisper.cpp's Vulkan build nests MSBuild paths deep enough to pass MAX_PATH under the
      # default target dir. rust-cache below points at the same folder.
      - name: Short cargo target dir
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$([IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\..\t"))" >> $env:GITHUB_ENV'
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.363.0
          cache: true
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> ../../t
      - run: pnpm install --frozen-lockfile
      # The script adds the Vulkan feature and bundles the Khronos loader (vulkan-1.dll) next
      # to the exe, so the app also starts on PCs without a GPU driver.
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          # Creates the release and uploads the installer, its signature and latest.json.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: node scripts/tauri-gpu.mjs
          tagName: ${{ github.ref_name }}
          releaseName: Kikitori ${{ github.ref_name }}
          releaseBody: |
            Windows 10/11（64ビット）用です。下の `Kikitori_…_x64-setup.exe` をダウンロードして開いてください。
            「Windows によって PC が保護されました」と表示されたら、**詳細情報** → **実行** を押します（インストーラーはまだコード署名されていません）。
            使い方は [README](https://github.com/${{ github.repository }}#readme) をご覧ください。

            For Windows 10/11 (64-bit). Download `Kikitori_…_x64-setup.exe` below and open it.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway** (the installer isn't code-signed yet).
            See the [English README](https://github.com/${{ github.repository }}/blob/main/README.en.md) for the full guide.
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
